<header class="header">  
  <nav class="navbar">  
    <div class="nav-container">  
      <a routerLink="/" class="logo logo--uv" aria-label="WeekendAcres Home" (click)="closeMenu()">  
        <img src="assets/photos/WA-logo.png" alt="WeekendAcres Logo" class="logo-img" />
      </a>

      <!-- Mobile Hamburger Button -->
      <button 
        class="hamburger-btn" 
        [class.open]="isMobileMenuOpen" 
        (click)="toggleMenu()" 
        aria-label="Toggle Navigation Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Navigation Links -->
      <ul class="nav-menu" [class.active]="isMobileMenuOpen">  
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a></li>  
        <li><a routerLink="/farms" routerLinkActive="active" (click)="closeMenu()">Live Farms</a></li>
        <li><a routerLink="/our-farm" routerLinkActive="active" (click)="closeMenu()">Our Farm</a></li>
        <li><a routerLink="/this-weekend" routerLinkActive="active" (click)="closeMenu()">This Weekend</a></li>
        <!-- <li><a routerLink="/activities" routerLinkActive="active" (click)="closeMenu()">Memberships</a></li>     -->
        <li><a routerLink="/farm-produce" routerLinkActive="active" (click)="closeMenu()">Farm Produce</a></li>
        <li><a routerLink="/wa-team" routerLinkActive="active" (click)="closeMenu()">The WA Team</a></li>  

        @if (authService.isLoggedIn()) {  
          <li><a [routerLink]="getDashboardRoute()" routerLinkActive="active" (click)="closeMenu()">Dashboard</a></li>  
          @if (authService.isUserAdmin()) {  
            <li><a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a></li>  
          }  
          <li class="user-info">  
            <span class="user-name">{{ getUserDisplayName() }}</span>  
            <button class="btn-logout" (click)="logout()">Logout</button>  
          </li>  
        } @else {  
          <li><a routerLink="/auth/login" class="btn-login-link" (click)="closeMenu()">Login</a></li>  
        }  
      </ul>  
    </div>  
  </nav>  
</header>
