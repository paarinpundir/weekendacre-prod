<div class="farm-amenities">
  <h2 class="section-title">What this place offers</h2>
  
  @if (amenities && amenities.length > 0) {
    <div class="amenities-grid">
      @for (amenity of amenities; track amenity.id || amenity.name) {
        <div class="amenity-item">
          <span class="amenity-icon">{{ getAmenityIcon(amenity.name) }}</span>
          <span class="amenity-name">{{ amenity.name }}</span>
        </div>
      }
    </div>
  } @else {
    <p class="no-amenities">No amenities listed</p>
  }
</div>
