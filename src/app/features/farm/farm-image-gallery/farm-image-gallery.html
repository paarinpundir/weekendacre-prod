<div class="farm-image-gallery">
  @if (images && images.length > 0) {
    <div class="gallery-container">
      <!-- Main Image -->
      <div class="main-image-container">
        <img 
          [src]="getImageUrl(images[selectedIndex])" 
          [alt]="'Farm image ' + (selectedIndex + 1)"
          class="main-image">
        @if (images.length > 5) {
          <button class="show-all-btn" (click)="showAllPhotos()">
            Show all photos
          </button>
        }
      </div>

      <!-- Thumbnail Grid -->
      @if (images.length > 1) {
        <div class="thumbnail-grid">
          @for (image of images.slice(0, 5); track $index) {
            <div 
              class="thumbnail" 
              [class.active]="selectedIndex === $index"
              (click)="selectImage($index)">
              <img 
                [src]="getImageUrl(image)" 
                [alt]="'Thumbnail ' + ($index + 1)"
                class="thumbnail-image">
            </div>
          }
          @if (images.length > 5) {
            <div class="thumbnail more-photos" (click)="showAllPhotos()">
              <div class="more-overlay">
                <span>+{{ images.length - 5 }}</span>
              </div>
              <img 
                [src]="getImageUrl(images[5])" 
                alt="More photos"
                class="thumbnail-image">
            </div>
          }
        </div>
      }
    </div>
  } @else {
    <div class="no-images">
      <p>No images available</p>
    </div>
  }
</div>
