<section class="contact-section">
  <div class="container">
    <h2 class="section-title">Contact Us</h2>
    
    <div class="contact-grid">
      <!-- Contact Info -->
      <div class="contact-info">
        <div class="info-item">
          <div class="info-icon">📞</div>
          <div class="info-content">
            <h3>Phone</h3>
            <a [href]="'tel:' + phone">{{ phone }}</a>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">✉️</div>
          <div class="info-content">
            <h3>Email</h3>
            <a [href]="'mailto:' + email">{{ email }}</a>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">📍</div>
          <div class="info-content">
            <h3>Location</h3>
            <p>{{ address }}</p>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <h3>Send us a message</h3>
        <form (ngSubmit)="onSubmit(formRef)" #formRef="ngForm" class="contact-form">
          <div class="form-group">
            <label for="name">Name *</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              [(ngModel)]="formData.name" 
              required 
              class="form-input">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="formData.email" 
              required 
              class="form-input">
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input 
              type="tel" 
              id="phone" 
              name="phone" 
              [(ngModel)]="formData.phone" 
              class="form-input">
          </div>

          <div class="form-group">
            <label for="message">Message *</label>
            <textarea 
              id="message" 
              name="message" 
              [(ngModel)]="formData.message" 
              required 
              rows="5" 
              class="form-input"></textarea>
          </div>

          <button type="submit" class="btn-submit" [disabled]="!formRef.form.valid">
            Send Message
          </button>
        </form>
      </div>
    </div>

    <!-- Map -->
    <div class="map-container">
      @if (getMapIframeUrl()) {
        <iframe
          [src]="getMapIframeUrl()"
          width="100%"
          height="400"
          style="border:0; border-radius: 12px;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      } @else {
        <div class="map-placeholder">
          <p>📍 {{ address }}</p>
          <a [href]="getMapUrl()" target="_blank" class="map-link">Open in Google Maps →</a>
        </div>
      }
    </div>
  </div>
</section>
