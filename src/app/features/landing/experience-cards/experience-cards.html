<section id="experiences-section" class="experience-cards">
  <div class="container">
    <div class="cards-grid">
      @for (card of cards; track card.id) {
        <a
          class="experience-card experience-card-link"
          [routerLink]="['/experiences', card.slug]"
          [style.background-image]="'url(' + card.imageUrl + ')'"
          [style.background-color]="card.backgroundColor || 'var(--color-surface-wash)'">
          <div class="card-overlay"></div>
          <div class="card-content">
            <h3 class="card-title">{{ card.title }}</h3>
            <p class="card-description">{{ card.description }}</p>
            <span class="card-cta">View details</span>
          </div>
        </a>
      }
    </div>
  </div>
</section>
