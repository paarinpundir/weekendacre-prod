<section class="gallery-section" id="gallery-section">
  <div class="container">
    <div class="section-header">
      <span class="kicker">In the fields</span>
      <h2 class="section-title">A glimpse of the experience</h2>
      <p class="section-subtitle">Hands in the soil, mornings by the water, evenings around the fire</p>
    </div>

    <div class="gallery-grid">
      @for (photo of photos; track photo.id; let i = $index) {
        <button
          type="button"
          class="gallery-tile"
          [class.gallery-tile--tall]="photo.size === 'tall'"
          [style.background-image]="'url(' + photo.url + ')'"
          (click)="openLightbox(i)"
          [attr.aria-label]="'View photo: ' + photo.caption">
          <span class="gallery-tile__scrim"></span>
          <span class="gallery-tile__caption">{{ photo.caption }}</span>
        </button>
      }
    </div>
  </div>

  @if (lightboxIndex !== null) {
    <div class="lightbox" (click)="closeLightbox()">
      <button type="button" class="lightbox__close" (click)="closeLightbox()" aria-label="Close">&times;</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" (click)="prev($event)" aria-label="Previous photo">&lsaquo;</button>
      <img class="lightbox__image" [src]="photos[lightboxIndex].url" [alt]="photos[lightboxIndex].caption" (click)="$event.stopPropagation()" />
      <button type="button" class="lightbox__nav lightbox__nav--next" (click)="next($event)" aria-label="Next photo">&rsaquo;</button>
      <div class="lightbox__caption">{{ photos[lightboxIndex].caption }}</div>
    </div>
  }
</section>
