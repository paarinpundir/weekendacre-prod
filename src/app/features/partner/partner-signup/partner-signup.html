<div class="auth-split-page">
  <div class="auth-split">
    <aside class="auth-split__form-side" aria-label="Farm partner registration">
      <div class="auth-glass auth-glass--wide">
        <div class="auth-brand-row">
          <a routerLink="/" class="auth-brand-mark">WeekendAcres</a>
        </div>

        <h1 class="auth-title">Become a Farm Partner</h1>
        <p class="auth-lead">List your land on the six-season calendar — steward visits with clarity and care.</p>

        <form (ngSubmit)="onSubmit()" class="signup-form">
          @if (errorMessage) {
            <div class="auth-error" role="alert">{{ errorMessage }}</div>
          }

          <div class="auth-field" [class.auth-field--filled]="isFilled(name)">
            <input
              id="name"
              type="text"
              [(ngModel)]="name"
              name="name"
              required
              autocomplete="name"
              placeholder=" " />
            <label for="name">Full name</label>
          </div>

          <div class="auth-field" [class.auth-field--filled]="isFilled(phone)">
            <input
              id="phone"
              type="tel"
              [(ngModel)]="phone"
              name="phone"
              required
              autocomplete="tel"
              placeholder=" " />
            <label for="phone">Phone</label>
          </div>

          <div class="auth-field" [class.auth-field--filled]="isFilled(email)">
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              autocomplete="email"
              placeholder=" " />
            <label for="email">Email</label>
          </div>

          <div class="auth-field auth-field--password" [class.auth-field--filled]="isFilled(password)">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="new-password"
              placeholder=" "
              minlength="8" />
            <label for="password">Password (8+ characters)</label>
            <button
              type="button"
              class="auth-password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          <div class="auth-field auth-field--password" [class.auth-field--filled]="isFilled(confirmPassword)">
            <input
              id="confirmPassword"
              [type]="showPasswordConfirm ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
              autocomplete="new-password"
              placeholder=" " />
            <label for="confirmPassword">Confirm password</label>
            <button
              type="button"
              class="auth-password-toggle"
              (click)="showPasswordConfirm = !showPasswordConfirm"
              [attr.aria-pressed]="showPasswordConfirm"
              [attr.aria-label]="showPasswordConfirm ? 'Hide confirm password' : 'Show confirm password'">
              {{ showPasswordConfirm ? 'Hide' : 'Show' }}
            </button>
          </div>

          <div class="auth-field auth-field--checkbox">
            <label class="auth-checkbox auth-checkbox--block">
              <input type="checkbox" [(ngModel)]="agreeToTerms" name="agreeToTerms" required />
              <span>
                I agree to the
                <a href="#" class="auth-link-gold" (click)="$event.preventDefault()">Terms</a>
                and
                <a href="#" class="auth-link-gold" (click)="$event.preventDefault()">Privacy</a>
              </span>
            </label>
          </div>

          <button type="submit" class="auth-btn-forest" [disabled]="isLoading">
            @if (isLoading) {
              <span>Creating your account…</span>
            } @else {
              <span>[ Create partner account ]</span>
            }
          </button>

          <div class="auth-footer-copy">
            Already part of the club?
            <a routerLink="/auth/login" class="auth-link-gold">Sign in</a>
          </div>
        </form>
      </div>
    </aside>

    <div class="auth-split__visual" aria-hidden="true">
      <p class="auth-split__visual-kicker">Founding stewards welcome</p>
      <p class="auth-split__visual-quote">Share your acres without selling your soul.</p>
    </div>
  </div>
</div>
