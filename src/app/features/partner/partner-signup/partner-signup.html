<div class="partner-signup">
  <div class="container">
    <div class="signup-card">
      <div class="signup-header">
        <h1>Become a Farm Partner</h1>
        <p>Join our network of farm partners and share your eco-adventure with guests</p>
      </div>
      
      <form (ngSubmit)="onSubmit()" class="signup-form">
        @if (errorMessage) {
          <div class="error-alert">{{ errorMessage }}</div>
        }
        
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input 
            id="name" 
            type="text" 
            [(ngModel)]="name" 
            name="name" 
            required 
            class="form-input" 
            placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number <span class="required">*</span></label>
          <input 
            id="phone" 
            type="tel" 
            [(ngModel)]="phone" 
            name="phone" 
            required 
            class="form-input" 
            placeholder="+91 98765 43210">
        </div>
        
        <div class="form-group">
          <label for="email">Email Address <span class="required">*</span></label>
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            required 
            class="form-input" 
            placeholder="your.email@example.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            required 
            class="form-input" 
            placeholder="Minimum 8 characters">
          <small>Password must be at least 8 characters long</small>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
          <input 
            id="confirmPassword" 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            required 
            class="form-input" 
            placeholder="Re-enter your password">
        </div>
        
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [(ngModel)]="agreeToTerms" 
              name="agreeToTerms" 
              required>
            <span>I agree to the <a href="#" class="link">Terms and Conditions</a> and <a href="#" class="link">Privacy Policy</a></span>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading">
          @if (isLoading) {
            <span>Creating Account...</span>
          } @else {
            <span>Create Account</span>
          }
        </button>
        
        <div class="signup-footer">
          <p>Already have an account? <a routerLink="/auth/login" class="link">Sign In</a></p>
        </div>
      </form>
    </div>
  </div>
</div>
